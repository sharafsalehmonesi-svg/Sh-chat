
name: Build SH-CHAT Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SH-CHAT-Android-GitHub-Pages-ICON.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          test -f "SH-CHAT-Android-GitHub-Pages-ICON.zip"
          unzip -q "SH-CHAT-Android-GitHub-Pages-ICON.zip" -d android-source
          test -f android-source/shchat-android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-source/shchat-android
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SH-CHAT-Android-APK
          path: android-source/shchat-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

